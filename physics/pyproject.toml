[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "radforce"
version = "0.1.0"
description = "Radiative-forcing physics for the Climate Radiative Forcing Lab (AR6-based, tested against published values)"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "pandas>=2.1", "scipy>=1.11"]

[project.optional-dependencies]
dev = ["pytest>=8", "fair>=2.2", "openpyxl>=3.1", "scipy>=1.11", "hitran-api>=1.3"]

[tool.setuptools.packages.find]
include = ["radforce*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
